# Выкладывает сервер на Supabase: база данных, функция рассылки, настройки входа.
# Нужны секреты репозитория SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Секреты Supabase ещё не добавлены, выкладку пропускаю"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest

      - name: База данных
        if: env.SKIP != '1'
        run: |
          sed -i "s/__PROJECT_REF__/$PROJECT_REF/g" supabase/migrations/*.sql
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --linked --include-all --yes

      - name: Функция рассылки
        if: env.SKIP != '1'
        run: supabase functions deploy push --no-verify-jwt --use-api --project-ref "$PROJECT_REF" --yes

      - name: Вход без подтверждения почты
        if: env.SKIP != '1'
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm": true, "site_url": "https://jundt-l.github.io/time-manager/"}' > /dev/null

      - name: Адрес сервера для приложения
        if: env.SKIP != '1'
        run: |
          ANON=$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then echo "::error::Не нашёл открытый ключ anon"; exit 1; fi
          printf "// Адрес сервера и открытый ключ. Файл заполняет GitHub при выкладке сервера.\nexport const SUPABASE_URL = 'https://%s.supabase.co';\nexport const SUPABASE_ANON = '%s';\n" "$PROJECT_REF" "$ANON" > js/config.js
          git checkout -- supabase/migrations
          if git diff --quiet js/config.js; then echo "Без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "Адрес сервера Supabase для приложения"
          git push
